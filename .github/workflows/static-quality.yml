name: Static site quality

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - ".github/workflows/static-quality.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "*.html"
      - ".github/workflows/static-quality.yml"

jobs:
  local-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local HTML assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys

          root = Path(".").resolve()
          errors = []

          class AssetParser(HTMLParser):
              def __init__(self, page):
                  super().__init__(convert_charrefs=True)
                  self.page = page

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in {"src", "href"} or not value:
                          continue
                      value = value.strip()
                      parsed = urlsplit(value)
                      if parsed.scheme or value.startswith(("#", "//")):
                          continue
                      target = (root / parsed.path.lstrip("/")) if parsed.path.startswith("/") else (self.page.parent / parsed.path)
                      if not parsed.path or not Path(target).suffix:
                          continue
                      if not target.resolve().is_file():
                          errors.append(f"{self.page.relative_to(root)}: missing {key}={value}")

          pages = sorted(root.glob("*.html"))
          if not pages:
              errors.append("No root-level HTML pages found.")
          for page in pages:
              parser = AssetParser(page)
              parser.feed(page.read_text(encoding="utf-8", errors="replace"))
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Checked local file references in {len(pages)} HTML pages.")
          PY
